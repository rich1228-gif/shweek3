<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel del Doctor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">

<div class="container-fluid">

<a class="navbar-brand fw-bold" href="#">

<i class="bi bi-heart-pulse-fill"></i>

Panel Médico

</a>

<div class="d-flex align-items-center">

<span class="text-white me-3" id="doctorNombre">

Dr. Usuario

</span>

<button
class="btn btn-outline-light"
id="btnLogout">

Cerrar Sesión

</button>

</div>

</div>

</nav>

<div class="container-fluid mt-4">

<div class="row">

<!-- Sidebar -->

<div class="col-lg-2">

<div class="list-group shadow">

<a href="#dashboard" class="list-group-item list-group-item-action active">

<i class="bi bi-speedometer2"></i>

Dashboard

</a>

<a href="#disponibilidad" class="list-group-item list-group-item-action">

<i class="bi bi-calendar2-week"></i>

Disponibilidad

</a>

<a href="#citas" class="list-group-item list-group-item-action">

<i class="bi bi-calendar-check"></i>

Mis Citas

</a>

<a href="#perfil" class="list-group-item list-group-item-action">

<i class="bi bi-person"></i>

Perfil

</a>

</div>

</div>

<!-- Contenido -->

<div class="col-lg-10">

<h2 class="mb-4">

Bienvenido Doctor

</h2>

<!-- Cards -->

<div class="row">

<div class="col-md-4">

<div class="card border-success shadow">

<div class="card-body">

<h6>

Citas de Hoy

</h6>

<h2 id="citasHoy">

0

</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card border-primary shadow">

<div class="card-body">

<h6>

Pendientes

</h6>

<h2 id="citasPendientes">

0

</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card border-warning shadow">

<div class="card-body">

<h6>

Atendidas

</h6>

<h2 id="citasAtendidas">

0

</h2>

</div>

</div>

</div>

</div>

<!-- Disponibilidad -->

<div class="card shadow mt-4">

<div class="card-header bg-success text-white">

<h5>

Registrar Disponibilidad

</h5>

</div>

<div class="card-body">

<form id="formDisponibilidad">

<div class="row">

<div class="col-md-4">

<label class="form-label">

Fecha

</label>

<input
type="date"
id="fechaDisponible"
class="form-control"
required>

</div>

<div class="col-md-4">

<label class="form-label">

Hora Inicio

</label>

<input
type="time"
id="horaInicio"
class="form-control"
required>

</div>

<div class="col-md-4">

<label class="form-label">

Hora Fin

</label>

<input
type="time"
id="horaFin"
class="form-control"
required>

</div>

</div>

<div class="mt-3">

<button
class="btn btn-success"
type="submit">

Guardar Disponibilidad

</button>

</div>

</form>

</div>

</div>

<!-- Tabla de citas -->

<div class="card shadow mt-4">

<div class="card-header bg-primary text-white">

<h5>

Mis Citas

</h5>

</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead>

<tr>

<th>ID</th>

<th>Paciente</th>

<th>Fecha</th>

<th>Hora</th>

<th>Estado</th>

<th>Acción</th>

</tr>

</thead>

<tbody id="tablaMisCitas">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="js/storage.js"></script>
<script src="js/doctor.js"></script>
<script src="js/citas.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
