<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel del Paciente</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

<div class="container-fluid">

<a class="navbar-brand fw-bold">

<i class="bi bi-hospital"></i>

Sistema Hospitalario

</a>

<div class="d-flex align-items-center">

<span class="text-white me-3" id="pacienteNombre">

Paciente

</span>

<button
class="btn btn-outline-light"
id="btnLogout">

Cerrar Sesión

</button>

</div>

</div>

</nav>

<div class="container-fluid mt-4">

<div class="row">

<!-- Sidebar -->

<div class="col-lg-2">

<div class="list-group shadow">

<a href="#inicio" class="list-group-item list-group-item-action active">

<i class="bi bi-house"></i>

Inicio

</a>

<a href="#solicitar" class="list-group-item list-group-item-action">

<i class="bi bi-calendar-plus"></i>

Solicitar Cita

</a>

<a href="#historial" class="list-group-item list-group-item-action">

<i class="bi bi-clock-history"></i>

Historial

</a>

<a href="#perfil" class="list-group-item list-group-item-action">

<i class="bi bi-person-circle"></i>

Mi Perfil

</a>

</div>

</div>

<!-- Contenido -->

<div class="col-lg-10">

<h2 class="mb-4">

Panel del Paciente

</h2>

<!-- Tarjetas -->

<div class="row">

<div class="col-md-4">

<div class="card shadow border-primary">

<div class="card-body">

<h6>

Próximas Citas

</h6>

<h2 id="proximasCitas">

0

</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow border-success">

<div class="card-body">

<h6>

Atendidas

</h6>

<h2 id="citasAtendidas">

0

</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow border-danger">

<div class="card-body">

<h6>

Canceladas

</h6>

<h2 id="citasCanceladas">

0

</h2>

</div>

</div>

</div>

</div>

<!-- Solicitar cita -->

<div class="card shadow mt-4">

<div class="card-header bg-success text-white">

<h5>

Solicitar Nueva Cita

</h5>

</div>

<div class="card-body">

<form id="formCita">

<div class="row">

<div class="col-md-4">

<label class="form-label">

Especialidad

</label>

<select
id="especialidad"
class="form-select"
required>

<option value="">Seleccione</option>

<option>Medicina General</option>

<option>Pediatría</option>

<option>Odontología</option>

<option>Cardiología</option>

<option>Dermatología</option>

<option>Psicología</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

Doctor

</label>

<select
id="doctor"
class="form-select"
required>

<option value="">Seleccione</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

Fecha

</label>

<input
type="date"
id="fecha"
class="form-control"
required>

</div>

</div>

<div class="row mt-3">

<div class="col-md-6">

<label class="form-label">

Hora

</label>

<input
type="time"
id="hora"
class="form-control"
required>

</div>

<div class="col-md-6 d-flex align-items-end">

<button
class="btn btn-success w-100"
type="submit">

<i class="bi bi-calendar-check"></i>

Solicitar Cita

</button>

</div>

</div>

</form>

</div>

</div>

<!-- Historial -->

<div class="card shadow mt-4">

<div class="card-header bg-primary text-white">

<h5>

Historial de Citas

</h5>

</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead>

<tr>

<th>ID</th>

<th>Doctor</th>

<th>Especialidad</th>

<th>Fecha</th>

<th>Hora</th>

<th>Estado</th>

<th>Acción</th>

</tr>

</thead>

<tbody id="tablaHistorial">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="js/storage.js"></script>
<script src="js/citas.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
